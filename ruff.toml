line-length = 100
target-version = "py311"
exclude = ["__pycache__", ".git"]

[lint]
# D1xx: every public module, class and function carries a docstring (2026-11-17,
# after a pass that closed 188 gaps). Tests are exempt -- their names are the doc.
# BLE: no blind `except Exception` (the house rule; see tools/prepush/standards).
select = ["E", "F", "I", "B", "UP", "W", "C4", "BLE",
          "D100", "D101", "D102", "D103", "D104", "D106"]
# No `ignore` list and no per-file F401 ignores: nothing is silenced here. The
# registration imports are declared in `__all__` / used explicitly instead
# (2026-11-17 standards sweep), and `python -m tools.standards_audit` gates the
# rest -- suppressions, broad excepts, function size -- in check.py.

[lint.per-file-ignores]
# A scope, not a silencer: a test's name is its documentation.
"tests/**" = ["D"]
