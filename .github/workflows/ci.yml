#   >>> Run `python check.py` instead. <<<
#
# check.py runs these same steps in this same order, and is the ONLY gate now.
# Prefer it over running pytest alone, because these two are easy to forget and
# are the ones that have actually caught things:
#   · the safety-gate suite, which runs FIRST and with NO dependencies installed,
#     precisely so a broken requirements file cannot mask a weakened gate
#   · the second pytest run with LANGGRAPH_STRICT_MSGPACK=true -- the check that
#     caught T15, where an unregistered state type comes back from a checkpoint
#     as a plain dict instead of raising
#
# NOTE: an all-comment file has no `on:` trigger, so GitHub will list this as an
# invalid workflow in the Actions tab. That is cosmetic. If you would rather it
# be ignored silently, rename the file to `ci.yml.disabled` -- Actions only reads
# `.yml`/`.yaml` -- and delete this note.
