<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Monitor</title>
<style>
:root{
 --bg:#f4f5f9;--panel:#fff;--sunk:#f8f9fc;--hover:#f5f7fb;--ink:#101828;--ink2:#344054;--mute:#667085;
 --line:#e4e7ec;--line2:#eef0f4;
 --side:#0f1525;--side2:#161e33;--side-ink:#98a2b8;--side-hi:#fff;
 --acc:#4f46e5;--acc-bg:#eef2ff;--acc-bd:#c7d2fe;
 --ok:#067647;--ok-bg:#ecfdf3;--ok-bd:#abefc6;
 --warn:#b54708;--warn-bg:#fffaeb;--warn-bd:#fedf89;
 --err:#d92d20;--err-bg:#fef3f2;--err-bd:#fecdca;
 --info:#175cd3;--info-bg:#eff8ff;--info-bd:#b2ddff;
 --idle:#98a2b3;--idle-bg:#f2f4f7;--idle-bd:#e4e7ec;
 --shadow:0 1px 2px rgba(16,24,40,.05);--shadow2:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
 --r:12px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0b0f19;--panel:#121826;--sunk:#0f1420;--hover:#161d2d;--ink:#eef0f5;--ink2:#cdd2dc;--mute:#8d96a8;
 --line:#222a3b;--line2:#1b2232;
 --side:#080b13;--side2:#111727;--side-ink:#8d96a8;--side-hi:#fff;
 --acc:#8b8dfc;--acc-bg:rgba(99,102,241,.14);--acc-bd:rgba(129,140,248,.35);
 --ok:#47cd89;--ok-bg:rgba(23,178,106,.12);--ok-bd:rgba(71,205,137,.3);
 --warn:#fdb022;--warn-bg:rgba(247,144,9,.12);--warn-bd:rgba(253,176,34,.3);
 --err:#f97066;--err-bg:rgba(240,68,56,.12);--err-bd:rgba(249,112,102,.3);
 --info:#53b1fd;--info-bg:rgba(46,144,250,.12);--info-bd:rgba(83,177,253,.3);
 --idle:#6b7385;--idle-bg:rgba(152,162,179,.1);--idle-bd:#2a3244;
 --shadow:none;--shadow2:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12px}
.mute{color:var(--mute)}.sm{font-size:12px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* ── shell ── */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff}
.logo svg.i{width:18px;height:18px}
.brand b{display:block;color:var(--side-hi);font-size:14px;font-weight:600;line-height:1.2}.brand span{font-size:12px}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 6px;color:#5d6780}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--side-ink);font-size:13.5px;margin-bottom:2px}
.nav:hover{background:var(--side2);color:var(--side-hi)}.nav:focus-visible{outline:2px solid var(--acc)}
.nav.on{background:var(--side2);color:var(--side-hi)}
.nav .cnt{margin-left:auto;font-size:11px;padding:0 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--side-hi)}
.nav .cnt.err{background:rgba(240,68,56,.25)}.nav .cnt.warn{background:rgba(247,144,9,.25)}
.side-foot{margin-top:auto;font-size:11.5px;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.06);word-break:break-all}
.side-foot .mono{font-size:11px;color:#6f7a93}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px}
.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.01em}.top .grow{flex:1}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:99px;box-shadow:var(--shadow)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pl 2s infinite}
.pulse.off{background:var(--err);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.content{padding:22px 28px 80px;max-width:1280px}
.banner{display:none;margin-bottom:16px;padding:10px 14px;border-radius:10px;border:1px solid var(--err-bd);background:var(--err-bg);color:var(--err);font-size:13px}
.banner.show{display:flex;gap:8px;align-items:center}

/* ── kpis ── */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .ic svg.i{width:19px;height:19px}
.kpi b{display:block;font-size:26px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--mute)}
.t-acc{background:var(--acc-bg);color:var(--acc)}.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}.t-err{background:var(--err-bg);color:var(--err)}
.t-info{background:var(--info-bg);color:var(--info)}.t-idle{background:var(--idle-bg);color:var(--mute)}

/* ── panels (collapsible) ── */
details.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;scroll-margin-top:80px}
details.panel>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;user-select:none;border-radius:var(--r)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
details.panel[open]>summary{border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.ph-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--acc-bg);color:var(--acc)}
.ph-t{font-weight:600;font-size:15px}.ph-s{font-size:12.5px;color:var(--mute)}
.chev{margin-left:auto;color:var(--mute);transition:transform .15s}
details.panel[open]>summary .chev{transform:rotate(180deg)}
.pb{padding:16px 18px}.pb.flush{padding:0}

/* ── badges ── */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid;white-space:nowrap;line-height:1.5}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.nodot::before{display:none}
.b-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.b-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.b-err{color:var(--err);background:var(--err-bg);border-color:var(--err-bd)}
.b-info{color:var(--info);background:var(--info-bg);border-color:var(--info-bd)}
.b-acc{color:var(--acc);background:var(--acc-bg);border-color:var(--acc-bd)}
.b-idle{color:var(--mute);background:var(--idle-bg);border-color:var(--idle-bd)}

/* ── tables ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--mute);background:var(--sunk);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
tr.dim td{opacity:.62}
.role{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
.role .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.note{margin-top:4px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}

/* ── toolbar ── */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--mute);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow2)}
.seg button:focus-visible{outline:2px solid var(--acc)}
.seg .n{font-size:11px;color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--mute);margin-left:auto;min-width:220px}
.search input{all:unset;flex:1;color:var(--ink);font-size:13px}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}

/* ── run rows ── */
.rhead,.rrow{display:grid;grid-template-columns:118px minmax(150px,1.1fr) minmax(0,2.6fr) 128px 74px 86px 22px;gap:14px;align-items:center}
.rhead{padding:9px 18px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);font-weight:500}
.run{border-bottom:1px solid var(--line2)}.run:last-child{border-bottom:0}
.rrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:118px minmax(150px,1.1fr) minmax(0,2.6fr) 128px 74px 86px 22px;gap:14px;align-items:center;width:100%;padding:13px 18px;cursor:pointer}
.rrow:hover{background:var(--hover)}.rrow:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.run.open>.rrow{background:var(--hover)}
.r-run b{display:block;font-weight:600;font-size:13.5px}.r-run span{font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.r-verdict{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
.r-verdict.err{color:var(--err)}
.r-t{font-size:12.5px;color:var(--mute);white-space:nowrap}
.r-chev{color:var(--mute);transition:transform .15s}.run.open .r-chev{transform:rotate(180deg)}
.strip{display:flex;gap:3px}.strip i{flex:1;height:6px;border-radius:3px;background:var(--idle-bg);border:1px solid var(--idle-bd)}
.strip i.s-ok{background:var(--ok);border-color:var(--ok)}.strip i.s-error{background:var(--err);border-color:var(--err)}
.strip i.s-waiting{background:var(--warn);border-color:var(--warn)}.strip i.s-retry{background:var(--warn);border-color:var(--warn)}
.empty{padding:28px 18px;text-align:center;color:var(--mute);font-size:13px}

/* ── run detail ── */
.detail{background:var(--sunk);border-top:1px solid var(--line2);padding:16px 18px 18px;display:none}
.run.open>.detail{display:block}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{background:var(--hover)}.btn:focus-visible{outline:2px solid var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{filter:brightness(1.08)}
.cmd{flex:1;min-width:240px;font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink2);overflow-x:auto;white-space:nowrap}
.callout{display:flex;gap:12px;border:1px solid var(--acc-bd);background:var(--acc-bg);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.callout .ic{color:var(--acc);margin-top:1px}.callout b{display:block;font-size:13px;margin-bottom:2px}
.callout ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}.callout li{margin:3px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:8px 12px;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc);font-weight:500}
.tab:focus-visible{outline:2px solid var(--acc)}
.tab .n{font-size:11px;padding:0 6px;border-radius:99px;background:var(--idle-bg);color:var(--mute)}
.tab .n.err{background:var(--err-bg);color:var(--err)}.tab .n.ok{background:var(--ok-bg);color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card.pad{padding:14px 16px}

/* steps */
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);position:relative}
ol.steps li:last-child{border-bottom:0}
.sic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.sic svg.i{width:14px;height:14px;stroke-width:2.5}
.s-name{font-weight:600;font-size:13.5px}.s-does{font-size:12.5px;color:var(--mute)}
.s-det{font-size:12.5px;margin-top:5px;color:var(--ink2)}
.s-t{font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.errbox{margin-top:8px;border:1px solid var(--err-bd);background:var(--err-bg);border-radius:8px;padding:10px 12px;font-size:12.5px}
.errbox .h{color:var(--ink);margin-bottom:4px}.errbox .e{color:var(--err);font-family:var(--mono);font-size:12px}
.retrybox{margin-top:8px;border:1px solid var(--warn-bd);background:var(--warn-bg);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink2)}
.retrybox b{color:var(--warn)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0 0;max-height:380px;overflow:auto;font:12px/1.5 var(--mono);color:var(--ink2)}
details.more>summary{cursor:pointer;font-size:12.5px;color:var(--acc);margin-top:8px;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ "}details.more[open]>summary::before{content:"▾ "}

/* gate */
.gates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gate{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.gate.fail{border-color:var(--err-bd);box-shadow:0 0 0 3px var(--err-bg)}
.gate .top2{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.gate b{font-size:13.5px}.gate p{margin:0;font-size:12.5px;color:var(--mute)}
.gate .why{margin-top:8px;font-size:12.5px;color:var(--err);font-family:var(--mono)}

/* findings */
.find{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);border-left:3px solid var(--idle)}
.find.high,.find.critical{border-left-color:var(--err)}.find.medium{border-left-color:var(--warn)}.find.low{border-left-color:var(--info)}
.find .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.find .loc{font-family:var(--mono);font-size:12.5px;font-weight:500}
.find .is{margin-top:8px;font-size:13.5px}
.find .sg{margin-top:8px;font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:8px 10px}
.find .sg b{color:var(--ok);font-weight:600}
.find .ct{margin-top:8px;font-size:12px;color:var(--mute)}
.summary{font-size:14px;margin:0 0 14px;color:var(--ink2)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:10px;min-width:170px}
.bar{position:relative;flex:1;height:7px;background:var(--idle-bg);border-radius:99px}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--acc)}
.bar>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45;border-radius:1px}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 20px;margin:0;font-size:13px}
dl.kv dt{color:var(--mute)}dl.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-all}

/* live */
.job{padding:16px 18px;border-bottom:1px solid var(--line2)}.job:last-child{border-bottom:0}
.job-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.job-h b{font-size:14px}
.lst{display:grid;grid-template-columns:22px 210px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:5px 0}
.lst .t{text-align:right;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.lbar{height:6px;background:var(--idle-bg);border-radius:99px;overflow:hidden}
.lbar>i{display:block;width:0;height:100%;background:var(--acc);border-radius:99px}
.lst .d{grid-column:2/5;font-size:12px;color:var(--mute);margin:-3px 0 3px}
.lst .d.err{color:var(--err)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.foot{margin-top:10px;font-size:12.5px;color:var(--mute)}

@media (max-width:1100px){.rhead{display:none}
 .rrow{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"st run t chev" "v v v v"}
 .r-st{grid-area:st}.r-run{grid-area:run}.r-t.when{grid-area:t}.r-chev{grid-area:chev}.r-verdict{grid-area:v}
 .r-strip,.r-t.dur{display:none}.gates{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:10px 12px}
 .brand{border:0;margin:0;padding:0 8px 0 0}.navh,.side-foot,.brand span{display:none}.nav{width:auto}
 .top,.content{padding-left:16px;padding-right:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .lst{grid-template-columns:22px minmax(0,1fr) 90px}.lst .lbar{display:none}.search{min-width:0;flex:1 1 100%;margin-left:0}}
@media (max-width:520px){.gates{grid-template-columns:1fr}}
</style></head><body>
<div class="app">
<aside class="side">
 <div class="brand"><div class="logo" data-ico="shield"></div><div><b>Code Reviewer Agent</b><span>Agent monitor</span></div></div>
 <div class="navh">Monitor</div>
 <button class="nav" data-go="sec-running"><span data-ico="activity"></span>Now running<span class="cnt" id="nav-running">0</span></button>
 <button class="nav" data-go="sec-models"><span data-ico="server"></span>Model server<span class="cnt" id="nav-models">–</span></button>
 <button class="nav" data-go="sec-history"><span data-ico="history"></span>Review history<span class="cnt" id="nav-history">0</span></button>
 <div class="side-foot"><div>Reading</div><div class="mono" id="where">connecting…</div></div>
</aside>

<div class="main">
 <header class="top">
  <div><h1>Overview</h1><div class="sm mute">Runs, models and reviews, live from the agent's own records</div></div>
  <div class="grow"></div>
  <div class="live"><span class="pulse" id="pulse"></span><span id="clock">connecting…</span></div>
 </header>

 <div class="content">
  <div class="banner" id="banner"><span data-ico="alert"></span><span id="banner-t"></span></div>
  <div class="kpis" id="kpis"></div>

  <details class="panel" id="sec-running" open>
   <summary><span class="ph-ic" data-ico="activity"></span><div><div class="ph-t">Now running</div><div class="ph-s" id="peek-running"></div></div><span class="chev" data-ico="down"></span></summary>
   <div class="pb flush" id="jobs"></div>
  </details>

  <details class="panel" id="sec-models" open>

const when=ts=>{if(!ts)return"";const d=new Date(ts),t=new Date();
 return d.toDateString()===t.toDateString()?d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):d.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})};

/* ── live work ─────────────────────────────────────────────────────────── */
function plan(job){
 const done=job.stages.map(s=>s.name),route=(job.stages.find(s=>s.detail&&s.detail.route)||{}).detail?.route;
 const dec=(job.stages.find(s=>s.detail&&s.detail.decision)||{}).detail?.decision;
 let rest=[];
 if(route==="ai_investigation")rest=["generate_diagnosis","independent_review",...(dec==="escalate_to_human"?[]:["await_approval","execute"]),"audit"];
 else if(route==="deterministic")rest=["await_approval","execute","audit"];
 else if(route)rest=["audit"];
 else rest=["generate_diagnosis","independent_review","audit"];
 const all=[...BASE,...rest];for(const n of done)if(!all.includes(n))all.push(n);return all;
}
function describe(d){
 if(!d)return"";const p=[];
 if(d.files!=null)p.push(`${d.files} files`);if(d.route)p.push(`route → ${ROUTE[d.route]||d.route}`);
 if(d.checks_summary){const c=d.checks_summary;p.push(`${c.flag} flagged, ${c.pass} passed, ${c.skip} not checked`)}
 if(d.retrieved)p.push(`retrieved ${d.retrieved.length} passages`);
 if(d.severity)p.push(`severity ${d.severity}, ${d.findings} finding(s)`);
 if(d.checks)p.push(Object.entries(d.checks).map(([k,v])=>`${k.replace("_ok","")} ${v?"✓":"✕"}`).join("  "));
 if(d.decision)p.push(`→ ${d.decision.replace(/_/g," ")}`);
 if(d.approved!=null)p.push(d.approved?"approved":"declined");return p.join(" · ");
}
function liveIcon(status){
 const m={ok:["check","t-ok"],error:["x","t-err"],waiting:["pause","t-warn"],running:["retry","t-acc"],pending:["dot","t-idle"]}[status]||["dot","t-idle"];
 const b=iconBox(m[0],m[1],"sic");if(status==="running")b.firstChild.classList.add("spin");return b}
function liveJob(job,est,now){
 const box=el("div","job"),h=el("div","job-h"),st=job.status||"running";
 h.append(badge(st==="waiting"?"Waiting for you":st==="error"?"Error":"Running",st==="error"?"b-err":st==="waiting"?"b-warn":"b-info"),
  el("b",null,`${job.tenant||"?"} · ${job.target||""}`),el("span","grow"),el("span","sm mute",`updated ${fmt((job.age_s||0)*1000)} ago`));
 h.children[2].style.flex="1";box.append(h);
 let left=0,anyRunning=false;
 for(const name of plan(job)){
  const s=[...job.stages].reverse().find(x=>x.name===name),status=s?s.status:"pending",row=el("div","lst");
  if(status==="running")anyRunning=true;
  row.append(liveIcon(status),el("span",status==="pending"?"mute":null,LABEL(name)));
  const bar=el("div","lbar"),fill=el("i"),t=el("span","t");
  if(status==="running"){const elapsed=now-Date.parse(s.started_at),e=est[name];
   fill.style.width=e?Math.min(98,elapsed/e*100)+"%":"30%";t.textContent=fmt(elapsed)+(e?` / ~${fmt(e)}`:"");if(e)left+=Math.max(0,e-elapsed)}
  else if(s&&s.duration_ms!=null){fill.style.width="100%";fill.style.background=`var(--${status==="error"?"err":status==="waiting"?"warn":"ok"})`;t.textContent=fmt(s.duration_ms)}
  else{t.textContent=est[name]?`~${fmt(est[name])}`:"";if(est[name])left+=est[name]}
  bar.append(fill);row.append(bar,t);
  const rt=(s&&s.retries)||[];
  const d=s&&(s.error?(hint(s.error)||firstLine(s.error)):[describe(s.detail),rt.length?`↻ retried ${rt.length}× (${rt[rt.length-1].reason})`:""].filter(Boolean).join(" · "));
  if(d)row.append(el("div","d"+(s.error?" err":""),d));box.append(row)}
 const foot=el("div","foot");
 foot.textContent=st==="waiting"?"Paused at the approval step. Answer the prompt in the terminal that started the review.":(anyRunning&&left?`About ${fmt(left)} left, based on the median of past runs.`:"");
 if(job.age_s>600&&anyRunning)foot.textContent+=` No update for ${fmt(job.age_s*1000)}. The process may have died.`;
 box.append(foot);return box;
}
function ingestJob(job){
 const box=el("div","job"),h=el("div","job-h"),st=job.status;
 h.append(badge(st==="finished"?"Finished":st==="error"?"Error":"Running",st==="finished"?"b-ok":st==="error"?"b-err":"b-info"),
  el("b",null,`Ingest · ${job.tenant} → ${job.namespace}`),el("span","sm mute",`phase: ${job.phase}`));box.append(h);
 if(job.total){const pct=job.done/job.total*100,bar=el("div","lbar"),fill=el("i");
  fill.style.width=pct+"%";if(st==="finished")fill.style.background="var(--ok)";bar.append(fill);box.append(bar);
  box.append(el("div","foot",`${job.done.toLocaleString()} / ${job.total.toLocaleString()} chunks (${pct.toFixed(1)}%) · ${job.rate||0}/s`
   +(st==="running"&&job.eta_s!=null?` · about ${fmt(job.eta_s*1000)} left`:"")+(job.elapsed_s?` · took ${fmt(job.elapsed_s*1000)}`:"")))}
 else box.append(el("div","foot",[job.files&&`${job.files} files`,job.chunks&&`${job.chunks} chunks`].filter(Boolean).join(" · ")||"Preparing…"));
 if(job.error)box.append(el("div","foot",job.error));return box;
}
const liveJobs=s=>s.jobs.filter(x=>x.kind==="ingest"?(x.status!=="finished"||x.age_s<900):(["running","waiting"].includes(x.status)&&x.age_s<900));
function renderJobs(s){
 const now=Date.parse(s.now),j=document.getElementById("jobs");j.replaceChildren();
 const live=liveJobs(s);
 if(!live.length){const e=el("div","empty");e.append(el("div",null,"Nothing running."),el("div","mono",`python -m app.review --tenant <name>   ·   python -m tools.ingest --tenant <name> --root <repo>`));j.append(e)}

}

/* ── history ───────────────────────────────────────────────────────────── */
let filter="all",query="",lastSig="",openRuns=new Set(),tabOf=new Map(),seeded=false,latest=null;
function bucket(r){return r.status==="crashed"||r.status==="incomplete"?"failed":r.status}
function expected(r){
 const done=r.steps.map(s=>s.name);let rest=[];
 if(r.route==="ai_investigation")rest=["generate_diagnosis","independent_review",...(r.decision==="escalate_to_human"?[]:["await_approval","execute"]),"audit"];
 else if(r.route==="deterministic")rest=["await_approval","execute","audit"];
 else if(r.route)rest=["audit"];
 // Runs from before prepush_checks existed did not skip it; they never had it.
 const base=done.includes("classify")&&!done.includes("prepush_checks")?BASE.filter(n=>n!=="prepush_checks"):BASE;
 const all=[...base,...rest];for(const n of done)if(!all.includes(n))all.push(n);return all;
}
function verdict(r){
 const a=r.audit||{},fails=GATE.filter(c=>(a.review||{})[c[0]]===false).map(c=>c[1].toLowerCase());
 const pf=tally(a.checks||[]).flag,pre=pf?` ${pf} pre-push flag(s).`:"",rt=retriesOf(r),rtx=rt?` Recovered from ${rt} model-server retr${rt>1?"ies":"y"}.`:"";
 switch(r.status){
  case"executed":return"Passed all four checks; you approved it and the review was written."+pre+rtx;
  case"escalated":return`Escalated: ${fails.length} of 4 checks failed (${fails.join(", ")}). Nothing was posted.`+pre+rtx;
  case"denied":return"Passed the checks, but you declined it at the approval prompt."+pre+rtx;
  case"human_review":return"Routed straight to a human. No model looked at it."+pre;
  case"crashed":return`Crashed at ${LABEL(r.error.step)}${rt?` after ${rt} retr${rt>1?"ies":"y"}`:""}: ${hint(r.error.message)||firstLine(r.error.message)}`;
  case"incomplete":{const l=r.steps[r.steps.length-1];return`Stopped after ${l?LABEL(l.name):"start"} without writing a record. The process was probably killed.`}
  case"in_progress":return"Still running, or just finished.";
  default:return r.outcome||""}
}
function stepDetail(name,a){
 const d=a.diagnosis,v=a.review;
 if(name==="prepush_checks"&&a.checks){const t=tally(a.checks);return a.checks.length?`${t.flag} flagged · ${t.pass} passed · ${t.skip} not checked`:"No checks apply to this surface."}
 if(name==="classify"&&a.route)return`Route → ${ROUTE[a.route]||a.route}`;
 if(name==="generate_diagnosis"&&d)return`Retrieved ${(a.retrieved||[]).length} passages · severity ${d.severity} · ${d.findings_count??0} finding(s) · ${(d.citations||[]).length} citation(s)`;
 if(name==="independent_review"&&v){const ok=GATE.filter(c=>v[c[0]]).length;return`${ok} of 4 checks passed → ${a.decision==="approve"?"approve":"escalate to a human"}`}
 if(name==="await_approval"&&a.approved!=null)return a.approved?"You approved":"You declined";
 if(name==="audit"&&a.outcome)return`Recorded outcome: ${a.outcome}`;
 return null;
}
function stepIcon(st){const m={ok:["check","t-ok"],error:["x","t-err"],waiting:["pause","t-warn"],skip:["dot","t-idle"],pending:["dot","t-idle"]}[st]||["dot","t-idle"];return iconBox(m[0],m[1],"sic")}
function stepsTab(r){
 const a=r.audit||{},ol=el("ol","steps"),seen=new Set(),stopped=r.status==="crashed"||r.status==="incomplete";
 for(const name of expected(r)){
  if(seen.has(name))continue;seen.add(name);
  const s=[...r.steps].reverse().find(x=>x.name===name);
  const st=s?(s.status==="error"?"error":s.status==="ok"?"ok":s.status):(stopped?"skip":"pending");
  const li=el("li"),[lbl,does]=STEP[name]||[name,""],mid=el("div");
  mid.append(el("div","s-name"+(st==="skip"?" mute":""),lbl),el("div","s-does",does));
  if(st==="skip")mid.append(el("div","s-det mute","Not reached: the run stopped earlier."));
  const det=s&&stepDetail(name,a);if(det)mid.append(el("div","s-det",det));
  const rt=(s&&s.retries)||[];
  if(rt.length){const b=el("div","retrybox");b.append(el("b",null,`↻ ${rt.length} retr${rt.length>1?"ies":"y"}`),
   document.createTextNode(" — "+rt.map(x=>`attempt ${x.attempt} of ${x.of} after ${x.wait_s}s (${x.reason})`).join("; ")+(st==="ok"?". Recovered.":". Gave up.")));mid.append(b)}
  if(s&&s.error){const b=el("div","errbox"),h=hint(s.error);if(h)b.append(el("div","h",h));b.append(el("div","e",firstLine(s.error)));
   const dd=el("details","more");dd.append(el("summary",null,"Full error"),el("pre",null,String(s.error).replace(/\\n/g,"\n")));b.append(dd);mid.append(b)}
  li.append(stepIcon(st),mid,el("span","s-t",s&&s.duration_ms!=null?fmt(s.duration_ms):""));ol.append(li)}
 if(!r.steps.length)ol.append(el("li","mute","No trace spans kept for this run; the audit record is all there is."));
 const c=el("div","card");c.append(ol);return c;
}
function prepushTab(a){
 const cs=a.checks||[];if(!cs.length)return el("div","empty","No pre-push checks ran for this run.");
 const t=tally(cs),box=el("div"),top=el("div","tags");top.style.marginBottom="12px";
 top.append(badge(`${t.flag} flagged`,t.flag?"b-err":"b-idle"),badge(`${t.pass} passed`,"b-ok"),badge(`${t.skip} not checked`,"b-idle"),
  el("span","sm mute","Computed by code. They inform the review; they do not decide it."));box.append(top);
 const flags=cs.filter(c=>c.status==="flag").sort((x,y)=>(x.step??0)-(y.step??0));
 if(flags.length){const card=el("div","card tw"),tb=el("table"),th=el("thead"),hr=el("tr"),body=el("tbody");
  for(const c of["Check","Where","What's wrong"])hr.append(el("th",null,c));th.append(hr);
  for(const c of flags){const tr=el("tr"),n=el("td");n.append(badge(pname(c.check),"b-err"));
   tr.append(n,el("td","mono",c.file?c.file+(c.line?`:${c.line}`:""):"(whole change)"),el("td",null,c.message||""));body.append(tr)}
  tb.append(th,body);card.append(tb);box.append(card)}
 const passed=[...new Set(cs.filter(c=>c.status==="pass").map(c=>c.check))];
 if(passed.length){const d=el("div","tags");d.style.marginTop="14px";for(const p of passed)d.append(badge(pname(p),"b-ok"));box.append(d)}
 const skips=cs.filter(c=>c.status==="skip");
 if(skips.length){const dd=el("details","more"),ul=el("ul");ul.style.margin="6px 0 0";ul.style.paddingLeft="18px";ul.className="sm";
  for(const c of skips){const li=el("li");li.append(el("b",null,pname(c.check)+": "),document.createTextNode(c.message||""));ul.append(li)}
  dd.append(el("summary",null,`Why ${skips.length} check(s) were not run`),ul);box.append(dd)}

}
function gateTab(a){
 const v=a.review;if(!v)return el("div","empty","The run did not reach the gate.");
 const g=el("div","gates"),fails=v.failures||[];
 for(const[k,name,what,re]of GATE){const ok=v[k],c=el("div","gate"+(ok===false?" fail":"")),top=el("div","top2");
  top.append(el("b",null,name),badge(ok?"Pass":ok===false?"Fail":"—",ok?"b-ok":ok===false?"b-err":"b-idle"));c.append(top,el("p",null,what));
  if(ok===false){const why=fails.filter(f=>re.test(f));if(why.length)c.append(el("div","why",why.join("; ")))}g.append(c)}
 const box=el("div");box.append(g);
 if(v.reasoning){const dd=el("details","more");dd.append(el("summary",null,"The judge model's explanation (advice only, never the verdict)"),el("pre",null,v.reasoning));box.append(dd)}

}
function findingsTab(a){
 const d=a.diagnosis;if(!d)return el("div","empty","No diagnosis for this run.");
 const box=el("div"),top=el("div","tags");top.style.marginBottom="10px";
 top.append(badge(`Severity ${d.severity}`,sevCls(d.severity)),badge(`${d.findings_count??0} finding(s)`,"b-idle","nodot"));box.append(top);
 if(d.summary)box.append(el("p","summary",d.summary));
 const list=d.findings;
 if(Array.isArray(list)&&list.length){for(const f of list){
  const c=el("div","find "+(f.severity||"medium")),h=el("div","hd");
  h.append(badge(f.severity||"?",sevCls(f.severity)),el("span","loc",(f.file||"(no file)")+(f.line?`:${f.line}`:"")));
  const sp=el("span");sp.style.flex="1";h.append(sp);
  if(offTarget(f)){const b=badge("cites a different file","b-warn");b.title="Every passage this finding cites comes from another file. Retrieval found no code for this one, so the claim cannot follow from its citations.";h.append(b)}
  const g=badge(f.grounded?"model says grounded":"model: not grounded","b-idle","nodot");g.title="The model's own claim. The Grounded gate check is computed by code from real retrieval scores.";h.append(g);c.append(h);
  if(f.issue)c.append(el("div","is",f.issue));
  if(f.suggestion){const s=el("div","sg");s.append(el("b",null,"Suggestion  "),document.createTextNode(f.suggestion));c.append(s)}
  if(f.citation_ids&&f.citation_ids.length)c.append(el("div","ct","Cites: "+f.citation_ids.map(x=>srcParts(x)[0]).join(", ")));
  box.append(c)}}
 else if(d.findings_count)box.append(el("div","empty",`This run predates finding text being recorded. Only the count (${d.findings_count}) was kept. Retry the review to see them.`));
 else box.append(el("div","empty","The model reported no individual findings."));
 if(d.proposed_comment){const dd=el("details","more");dd.append(el("summary",null,"The comment it would have posted"),el("pre",null,d.proposed_comment));box.append(dd)}

function evidenceTab(a){
 const hits=a.retrieved||[];if(!hits.length)return el("div","empty","Nothing was retrieved, so no claim could be grounded.");
 const cited=new Set(((a.diagnosis||{}).citations||[]).map(c=>c.snippet_id)),bar=(a.gates||{}).min_relevance_score;
 const card=el("div","card tw"),t=el("table"),th=el("thead"),hr=el("tr"),tb=el("tbody");
 for(const c of["#","Source","Relevance",""])hr.append(el("th",null,c));th.append(hr);
 hits.forEach((h,i)=>{const tr=el("tr"),[path,rest]=srcParts(h.id),src=el("td");
  src.append(el("div","mono",path));if(rest)src.append(el("div","note",rest));
  const sc=el("td"),wrap=el("div","score"),b=el("div","bar"),f=el("i");f.style.width=Math.max(0,Math.min(1,+h.score))*100+"%";
  if(bar!=null&&+h.score<bar)f.style.background="var(--err)";b.append(f);
  if(bar!=null){const u=el("u");u.style.left=bar*100+"%";u.title=`relevance bar ${bar}`;b.append(u)}
  wrap.append(b,el("span","mono",(+h.score).toFixed(3)));sc.append(wrap);
  const ct=el("td");if(cited.has(h.id))ct.append(badge("cited","b-acc"));
  tr.append(el("td","mute",String(i+1)),src,sc,ct);tb.append(tr)});
 t.append(th,tb);card.append(t);const box=el("div");box.append(card);
 if(bar!=null){const n=el("div","sm mute",`The marker is this codebase's relevance bar (${bar}). A cited passage below it fails the Grounded check.`);n.style.marginTop="8px";box.append(n)}
 return box;
}
function detailsTab(r){
 const a=r.audit||{},dl=el("dl","kv"),rt=a.runtime||{},g=a.guard||{};
 const kv=(k,v)=>{if(v==null||v==="")return;dl.append(el("dt",null,k),el("dd",null,String(v)))};
 kv("Run id",r.run_id);kv("Thread id",r.thread_id);
 if(rt.models)kv("Models used",`diagnosis ${rt.models.diagnosis} · judge ${rt.models.judge} · entailer ${rt.entailer||"lexical"}`);
 if(g.total_redactions!=null)kv("Redacted before any model saw it",g.total_redactions?Object.entries(g.redacted||{}).map(([k,v])=>`${v} ${k}`).join(", "):"nothing");
 if(g.injection_suspected&&Object.keys(g.injection_suspected).length)kv("Injection phrasing seen",JSON.stringify(g.injection_suspected));
 const gt=a.gates||{},ent=gt.min_entailment_score??(((a.review||{}).failures||[]).join(" ").match(/entailed.*< ([0-9.]+)/)||[])[1];
 if(Object.keys(gt).length)kv("Bars it was held to",`relevance ≥ ${gt.min_relevance_score??"default"} · entailment ≥ ${ent??"default (0.25)"} · severities ${(gt.severity_allowlist||[]).join("/")}`);
 kv("Policy / prompt version",a.policy_version&&`${a.policy_version} / ${a.prompt_version}`);
 const box=el("div","card pad");box.append(dl);
 if(r.audit){const dd=el("details","more");dd.append(el("summary",null,"Raw audit record (JSON)"),el("pre",null,JSON.stringify(r.audit,null,2)));box.append(dd)}

}
function nextSteps(r){
 const a=r.audit||{},v=a.review||{},tips=[];
 if(r.status==="crashed")tips.push(hint(r.error.message)||"Read the full error on the failed step, fix it, then retry.");
 if(r.status==="incomplete")tips.push("The process stopped without a record. Retry the review.");
 if(tally(a.checks||[]).flag)tips.push("Fix the pre-push flags. They are computed facts, not model opinion.");
 if(r.status==="escalated"){
  const fs=(a.diagnosis||{}).findings||[],off=fs.filter(offTarget).length;
  if(v.entailment_ok===false){
   if(off)tips.push(`${off} of ${fs.length} findings cite only passages from a different file. Retrieval found no code for those files, so the claims cannot follow from their citations. That is the main reason Entailed failed, not the wording.`);
   if((a.runtime||{}).entailer!=="cross_encoder")tips.push("The entailer is lexical (it counts shared words), so a correct paraphrase can also fail. ENTAILER=cross_encoder judges meaning instead. The 0.25 bar is uncalibrated.")}
  if(v.groundedness_ok===false)tips.push("Grounded failed: a citation was not retrieved or scored under the relevance bar. See the Evidence tab.");
  if(v.risk_ok===false)tips.push("Risk failed: this severity always goes to a human under this codebase's policy. That is working as intended.");
  if(v.permission_ok===false)tips.push("Permission failed: the proposed action is not on this codebase's allowlist.");
  tips.push("Escalated means a human decides, not that the review is wrong. Read the findings yourself.")}
 if(!tips.length)return null;
 const c=el("div","callout"),body=el("div"),ul=el("ul");c.append(iconBox("bulb","","ic"));body.append(el("b",null,"What to do next"));
 for(const t of tips)ul.append(el("li",null,t));body.append(ul);c.append(body);return c;
}
async function copy(text,btn){
 let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
 const lbl=btn.lastChild;const old=lbl.textContent;lbl.textContent=ok?"Copied":"Select and copy";setTimeout(()=>{lbl.textContent=old},1600);
}
function actionsBar(r){
 if(!r.retry_command)return null;
 const bar=el("div","actions"),b=el("button","btn"+(["crashed","incomplete","escalated"].includes(r.status)?" primary":""));
 b.append(ico("retry"),el("span",null,"Copy retry command"));b.onclick=e=>{e.stopPropagation();copy(r.retry_command,b)};
 const cmd=el("div","cmd",r.retry_command);cmd.title="Run this in a terminal in the agent's directory. The monitor itself never starts a run.";
 bar.append(b,cmd);return bar;
}
function detailFor(r){
 const a=r.audit||{},box=el("div"),t=tally(a.checks||[]),fs=((a.diagnosis||{}).findings||[]).length||(a.diagnosis||{}).findings_count||0;
 add(box,actionsBar(r),nextSteps(r));
 const gateOk=a.review?GATE.filter(c=>a.review[c[0]]).length:null;
 const TABS=[["steps","Steps",String(r.steps.length),r.status==="crashed"||r.status==="incomplete"?"err":""],
  ["prepush","Pre-push checks",(a.checks||[]).length?String(t.flag):null,t.flag?"err":"ok"],
  ["gate","Gate",gateOk!=null?`${gateOk}/4`:null,gateOk===4?"ok":gateOk!=null?"err":""],
  ["findings","Findings",a.diagnosis?String(fs):null,""],["evidence","Evidence",a.retrieved?String((a.retrieved||[]).length):null,""],
  ["details","Details",null,""]];
 const tabs=el("div","tabs"),panel=el("div");tabs.setAttribute("role","tablist");
 const cur=tabOf.get(r.run_id)||"steps";
 const show=k=>{tabOf.set(r.run_id,k);for(const b of tabs.children)b.setAttribute("aria-selected",String(b.dataset.k===k));
  panel.replaceChildren(({steps:()=>stepsTab(r),prepush:()=>prepushTab(a),gate:()=>gateTab(a),findings:()=>findingsTab(a),evidence:()=>evidenceTab(a),details:()=>detailsTab(r)})[k]())};
 for(const[k,l,n,cls]of TABS){const b=el("button","tab");b.dataset.k=k;b.setAttribute("role","tab");b.append(el("span",null,l));
  if(n!=null)b.append(el("span","n "+cls,n));b.onclick=()=>show(k);tabs.append(b)}
 box.append(tabs,panel);show(cur);return box;
}
function runRow(r){
 const isOpen=openRuns.has(r.run_id),wrap=el("div","run"+(isOpen?" open":"")),row=el("button","rrow");
 row.setAttribute("aria-expanded",String(isOpen));
 const[lbl,cls]=STATUS[r.status]||[r.status,"b-idle"],stc=el("span","r-st");stc.append(badge(lbl,cls));
 const run=el("span","r-run");run.append(el("b",null,`${r.tenant||"?"} · ${r.target||""}`),el("span",null,String(r.run_id||"").slice(0,8)));
 const strip=el("span","strip r-strip");
 for(const n of expected(r)){const s=[...r.steps].reverse().find(x=>x.name===n);
  const i=el("i",s?"s-"+(s.status==="ok"?((s.retries||[]).length?"retry":"ok"):s.status):null);i.title=LABEL(n)+(s?`: ${s.status}${(s.retries||[]).length?`, ${s.retries.length} retry`:""}`:": not reached");strip.append(i)}
 const chev=el("span","r-chev");chev.append(ico("down"));
 row.append(stc,run,el("span","r-verdict"+(bucket(r)==="failed"?" err":""),verdict(r)),strip,el("span","r-t dur",fmt(r.total_ms)),el("span","r-t when",when(r.ended_at)),chev);
 const det=el("div","detail");if(isOpen)det.append(detailFor(r));
 row.onclick=()=>{const o=!wrap.classList.contains("open");wrap.classList.toggle("open",o);row.setAttribute("aria-expanded",String(o));
  if(o){openRuns.add(r.run_id);if(!det.childElementCount)det.append(detailFor(r))}else openRuns.delete(r.run_id)};

}
function matches(r,q){if(!q)return true;const a=r.audit||{};
 const hay=[r.tenant,r.target,r.status,r.run_id,verdict(r),(r.error||{}).message,...(a.checks||[]).map(c=>`${c.check} ${c.file} ${c.message}`),
  ...(((a.diagnosis||{}).findings)||[]).map(f=>`${f.file} ${f.issue}`)].join(" ").toLowerCase();return hay.includes(q)}
function renderFilters(recent){
 const f=document.getElementById("filters");f.replaceChildren();
 for(const[k,l]of FILTERS){const n=k==="all"?recent.length:recent.filter(r=>bucket(r)===k).length;
  const b=el("button");b.append(el("span",null,l),el("span","n",String(n)));b.setAttribute("aria-pressed",String(filter===k));
  b.onclick=()=>{filter=k;lastSig="";render(latest)};f.append(b)}
}
function renderHistory(recent){
 const sig=filter+"|"+query+"|"+JSON.stringify(recent);if(sig===lastSig)return;lastSig=sig;
 if(!seeded&&recent.length){openRuns.add(recent[0].run_id);seeded=true}
 renderFilters(recent);
 const h=document.getElementById("history");h.replaceChildren();
 const shown=recent.filter(r=>(filter==="all"||bucket(r)===filter)&&matches(r,query));
 if(!shown.length)h.append(el("div","empty",recent.length?"No runs match.":"No runs yet. Start one with python -m app.review --tenant <name>"));

 const live=liveJobs(s),m=s.models,tbl=m.table||[],ready=tbl.filter(r=>r.state==="ready").length,bad=tbl.filter(r=>["missing","not_loaded"].includes(r.state)).length;
 const f=s.recent.filter(r=>bucket(r)==="failed").length,set=(id,t)=>{document.getElementById(id).textContent=t};
 set("peek-running",live.length?`${live.length} in progress`:"Nothing running");

  `LM Studio up at ${m.url} · ${m.loaded.length} of ${m.available} downloaded models loaded · profile ${(m.runtime||{}).profile||"?"} `+
  ((m.runtime||{}).source==="run"?`(as used by the review at ${when(m.runtime.as_of)})`:"(from this shell; no review has recorded its models yet)"));
 set("peek-history",`${s.recent.length} recent runs${f?` · ${f} crashed or stopped`:""}`);
 const nr=document.getElementById("nav-running");nr.textContent=String(live.length);nr.className="cnt"+(live.length?" warn":"");

/* Folded sections are a per-viewer convenience: remembered in this browser
   when storage works, and the page is fine when it does not. */
const FOLD_KEY="cra-monitor-folded";
(function folds(){
 let folded=[];try{folded=JSON.parse(localStorage.getItem(FOLD_KEY)||"[]")}catch(e){}
 for(const d of document.querySelectorAll("details.panel")){if(folded.includes(d.id))d.open=false;
  d.addEventListener("toggle",()=>{try{localStorage.setItem(FOLD_KEY,JSON.stringify([...document.querySelectorAll("details.panel")].filter(x=>!x.open).map(x=>x.id)))}catch(e){}})}
 for(const b of document.querySelectorAll("[data-go]"))b.onclick=()=>{const d=document.getElementById(b.dataset.go);d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"});
  for(const x of document.querySelectorAll(".nav"))x.classList.toggle("on",x===b)};
 document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();renderHistory((latest||{}).recent||[])});
})();

/* ── loop: poll every second; on failure say so and back off ───────────── */
let fails=0;
function render(s){if(!s)return;renderKpis(s.recent);renderJobs(s);renderModels(s.models);renderHistory(s.recent);renderChrome(s)}
async function tick(){
 try{const r=await fetch("/api/status",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);latest=await r.json();fails=0}
 catch(e){fails++;const wait=Math.min(30,2**Math.min(fails,5));
  document.getElementById("banner").classList.add("show");
  document.getElementById("banner-t").textContent=`Lost contact with the monitor server (${fails} failed attempt${fails>1?"s":""}). Retrying in ${wait}s. If it stopped, restart it: python -m app.monitor`;
  document.getElementById("pulse").classList.add("off");document.getElementById("clock").textContent="disconnected";
  setTimeout(tick,wait*1000);return}
 document.getElementById("banner").classList.remove("show");document.getElementById("pulse").classList.remove("off");
 document.getElementById("where").textContent=latest.data_dir;
 document.getElementById("clock").textContent="Live · "+new Date().toLocaleTimeString();
 render(latest);setTimeout(tick,1000);
}
tick();
