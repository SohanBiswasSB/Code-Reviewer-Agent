[pytest]
testpaths = tests
# The project root on sys.path, so tests import `config`, `app`, ... at the top of
# the file. (conftest.py used to insert it by hand, which forced every import
# after it to sit below code and be silenced.)
pythonpath = .
addopts = -q --strict-markers
markers =
    needs_server: requires a running LM Studio server (skipped unless selected with -m)
    needs_model: loads a real local model, e.g. the reranker (skipped unless selected with -m)
